<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>hyperFocus - Список дел и Таймер</title>
    <link rel="stylesheet" href="styles.css">
    <style>
@import url('https://fonts.googleapis.com/css2?family=Nunito:ital,wght@0,200..1000;1,200..1000&display=swap');
</style>
</head>
<body>
    <header>
        <h1>hyperFocus</h1>
        <nav>
            <a href="index.html">Главная</a>
            <a href="todo.html">Список дел и Таймер</a>
        </nav>
    </header>
    <main>
        <section class="todo-section">
            <h2>Список дел</h2>
            <div class="todo-input">
                <input type="text" id="new-task" placeholder="Добавить новую задачу">
                <button id="add-task">Добавить</button>
            </div>
            <ul id="task-list"></ul>
        </section>
        <section class="timer-section">
            <h2>Таймер Pomodoro</h2>
            <div class="settings">
                <label for="work-time">Время работы (мин, макс 50):</label>
                <input type="number" id="work-time" min="1" max="50" value="25">
                <label for="break-time">Время отдыха (мин, макс 20):</label>
                <input type="number" id="break-time" min="1" max="20" value="5">
                <button id="apply-settings">Применить</button>
            </div>
            <div class="timer-display">
                <div id="timer">25:00</div>
                <div class="controls">
                    <button id="start">Старт</button>
                    <button id="pause">Пауза</button>
                    <button id="reset">Сброс</button>
                </div>
            </div>
            <div class="session-info">
                <p>Сессия: <span id="session-count">0</span></p>
                <p>Статус: <span id="status">Работа</span></p>
            </div>
        </section>
    </main>
    <script src="script.js"></script>
</body>
</html>
